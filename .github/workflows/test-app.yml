name: Test the app
# Every DriveMate test runs here, in this public repository (REGISTER.md). The app's code is
# fetched from the private drivemate-app with a read-only token and only built on the runner:
# just the summary and the picture page are published, never app code or an APK.
on:
  # One run per change: on its pull request, and again once merged to main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: drivemate-app branch, tag or commit to test (empty = same-named branch, else main)
        required: false
        default: ''
      batch:
        description: Related batch (partial runs cannot authorize a release)
        type: choice
        options: [all, A, B, C, D, E, F]
        default: all
permissions:
  contents: read
concurrency:
  # One run per change; a newer push or pull request update replaces an older one. Runs started by
  # hand or by the signed build (each for its own app commit) are never cancelled.
  group: test-app-${{ github.ref }}-${{ inputs.app_ref || github.event_name }}-${{ inputs.batch || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DRIVEMATE_TEST_BATCH: ${{ inputs.batch || 'all' }}
    steps:
      - name: Free runner disk for the app build and emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify approved public test source inventory (TF-05)
        # Fail before using app credentials, Android SDK or emulator resources.
        # Inventory source integrity is not proof of test execution or release readiness.
        run: |
          python3 -m unittest discover -s ci -p 'test_suite_inventory.py'
          python3 ci/suite_inventory.py --root . \
            --manifest ci/approved_suite_inventory.json \
            --output results/suite-inventory.json
      - name: Check the app token is set
        env:
          TOKEN: ${{ secrets.DRIVEMATE_APP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret DRIVEMATE_APP_TOKEN is missing: add a read-only token for phuk-prog/drivemate-app (see README)."
            exit 1
          fi
      - name: Pick the app version to test
        id: appref
        env:
          TOKEN: ${{ secrets.DRIVEMATE_APP_TOKEN }}
          INPUT_REF: ${{ inputs.app_ref }}
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          elif git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/phuk-prog/drivemate-app" "$branch" >/dev/null 2>&1; then
            ref="$branch"
          else
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing drivemate-app at $ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phuk-prog/drivemate-app
          ref: ${{ steps.appref.outputs.ref }}
          token: ${{ secrets.DRIVEMATE_APP_TOKEN }}
          path: app-src
          persist-credentials: false
      - name: Install the tests into the app
        id: install
        run: |
          echo "app_sha=$(git -C app-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 ci/test_selection.py app-src
          # What the screen tests need to draw the app's own composables. Added on the runner only,
          # so the app (and its APK) never carries test code.
          cat >> app-src/app/build.gradle.kts <<'KTS'

          dependencies {
              androidTestImplementation(platform("androidx.compose:compose-bom:2024.12.01"))
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
          }
          KTS
          find app-src/app/src/test app-src/app/src/androidTest -type f | sed 's|app-src/app/src/||'
      - name: Prepare pinned live Stockport source for real Android installation test
        # No app source, new map or APK is committed or published.
        if: steps.install.outputs.has_screen == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if find app-src/app/src/androidTest/java -name 'PublishedStockportOfflineScreenTest.kt' | grep -q .; then
            python3 ci/prepare_stockport_live_test.py \
              --output app-src/app/src/androidTest/assets/stockport-live-region.json
          fi
      # Verify the map-schema dependency without building or publishing any map data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phuk-prog/drivemate-map
          ref: d20c41f039f20b900eb46523827b01eecee167f3
          path: map-schema
          persist-credentials: false
      - name: Diagnose routing graph downloader/publisher alignment
        # Checked-out app and pinned map-publisher code; this is NOT an offline acceptance test.
        run: |
          python3 ci/routing_release_alignment.py \
            --app-file app-src/app/src/main/java/com/drivemate/app/data/RoadPack.kt \
            --publisher-workflow map-schema/.github/workflows/map-data.yml \
            --publisher-repository phuk-prog/drivemate-map \
            --output results/routing-release-alignment.json
          python3 - <<'PY'
          import json, os
          result = json.load(open('results/routing-release-alignment.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Offline road-graph release target: **' + result['reason'] + '** (acceptance OPEN)\\n')
          assert result['offline_acceptance'] is False
          PY
      - name: Audit production external links in their current test categories
        # One source-only pass over exact app SHA; no network probing or APK assertions.
        run: |
          python3 ci/category_connections.py \
            --app-root app-src --programme ci/programme.json \
            --routing-alignment results/routing-release-alignment.json \
            --batch "${DRIVEMATE_TEST_BATCH}" \
            --output results/category-connection-audit.json
          python3 - <<'PY'
          import json, os
          value=json.load(open('results/category-connection-audit.json'))
          assert len(value['categories']) == 23
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### External links by current test category (source-only)\\n')
              for number, item in value['categories'].items():
                  if item['status'] == 'not_selected':
                      continue
                  summary.write(f"- Category {number}: {item['status']} ({item['references']} references; "
                                f"{','.join(item['finding_codes']) or 'no known blocker'})\\n")
              summary.write('APK/network download acceptance: **NOT VERIFIED**\\n')
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify mapped building height provenance
        id: schema
        run: |
          curl -sSfL -o "$RUNNER_TEMP/planetiler.jar" https://github.com/onthegomap/planetiler/releases/download/v0.10.1/planetiler.jar
          printf '%s  %s\n' 5e5e7d8c4fc89b4573cc9109d0a543c3c2c798b2bcde7c3dcd2214031ee59c29 "$RUNNER_TEMP/planetiler.jar" | sha256sum --check --strict
          python3 ci/verify_map_schema.py "$RUNNER_TEMP/planetiler.jar" map-schema/schema/drivemate-map.yml schema-results/TEST-map-schema.xml
      - id: java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify test collection fails closed for missing suites
        id: collection
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py'
          python3 ci/verify_frozen_lanes.py
      - name: Observe reviewed public services with bounded receipts
        id: serviceprobe
        # Provider failures are observations; malformed/missing harness evidence fails CI.
        run: |
          python3 ci/service_probe.py \
            --app-sha "${{ steps.install.outputs.app_sha }}" --test-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --batch "$DRIVEMATE_TEST_BATCH" --output results/service-probe.json
      - id: android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - id: sdk
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - id: gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Run the tests
        id: unit
        working-directory: app-src
        # Build output stays ephemeral. Only bounded error messages enter summary.json.
        run: |
          if ./gradlew :app:testDebugUnitTest --no-daemon --continue --max-workers=4 > "$RUNNER_TEMP/drivemate-unit.log" 2>&1; then
            echo 0 > "$RUNNER_TEMP/drivemate-unit.exit"
          else
            echo "$?" > "$RUNNER_TEMP/drivemate-unit.exit"
            echo 'Unit checks failed; summary.json records the reason.'
          fi
      - name: Enable KVM for the emulator
        id: kvm
        if: steps.install.outputs.has_screen == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the screen tests on the emulator
        id: screen
        if: steps.install.outputs.has_screen == 'true'
        # The debug build is only installed on the emulator; it is never uploaded.
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2.33.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: app-src
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --continue -Pandroid.testInstrumentationRunnerArguments.package=com.drivemate.tests > "$RUNNER_TEMP/drivemate-screen.log" 2>&1 && echo 0 > "$RUNNER_TEMP/drivemate-screen.exit" || { result=$?; echo "$result" > "$RUNNER_TEMP/drivemate-screen.exit"; echo 'Screen checks failed; summary.json records the reason.'; }
            adb logcat -d -s AndroidRuntime:E libc:F DEBUG:F DM_CAT5_STAGE:I > "$RUNNER_TEMP/drivemate-native.log" 2>&1 || true
            # After the navigation/emulator screens, observe actual device
            # connectivity, not airplane-mode settings or host reachability.
            # Inconclusive stays INCONCLUSIVE: this is transport evidence only,
            # not proof that a published map was installed and used offline.
            python3 ../ci/emulator_network_probe.py --output ../results/emulator-network-probe.json
            # Record actual device fixture bytes separately; no production app cache.
            python3 ../ci/emulator_fixture_readback.py --source ../app-unit/resources/cat3-published-manchester-lanes-3.json --out ../results/emulator-fixture-readback.json
      - name: Inspect URL constants in the exact emulator-built debug APK
        # Read APK bytes on-runner; upload only a bounded receipt, never the APK.
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: |
          python3 ci/apk_connection_check.py \
            --apk app-src/app/build/outputs/apk/debug/app-debug.apk \
            --source-report results/category-connection-audit.json \
            --app-root app-src --app-sha "${{ steps.install.outputs.app_sha }}" \
            --output results/apk-connection-audit.json
      - name: Summary and picture page
        # Only once the app was fetched, and never for a cancelled run.
        if: (success() || failure()) && steps.install.outcome == 'success'
        env:
          DIAGNOSTIC_STEPS: ${{ toJSON(steps) }}
        run: |
          mkdir -p results
          python3 -m pip install -q Pillow==11.0.0 || true
          media=app-src/app/build/outputs/connected_android_test_additional_output
          python3 ci/collect_results.py results/full-app.json \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "${{ steps.install.outputs.app_sha }}" "$GITHUB_SHA" "$media" \
            app-src/app/build/test-results/testDebugUnitTest app-src/app/build/outputs/androidTest-results schema-results \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 ci/run_summary.py results/full-app.json results/summary.json
          python3 - <<'PY_DIAGNOSTICS'
          import json, os, re
          from pathlib import Path
          target = Path("results/summary.json")
          summary = json.loads(target.read_text())
          diagnostics = []
          steps = json.loads(os.environ.get("DIAGNOSTIC_STEPS", "{}"))
          for name in ("schema", "java", "collection", "serviceprobe", "android", "sdk", "gradle", "kvm", "unit", "screen"):
              if steps.get(name, {}).get("outcome") == "failure":
                  diagnostics.append({"stage": name, "message": "Setup or execution step failed before completion"})
          for stage in ("unit", "screen"):
              root = Path(os.environ["RUNNER_TEMP"])
              status = root / f"drivemate-{stage}.exit"
              if not status.is_file() or status.read_text().strip() == "0":
                  continue
              messages = []
              log = root / f"drivemate-{stage}.log"
              for line in log.read_text(errors="replace").splitlines() if log.is_file() else []:
                  line = re.sub(r"\x1b\[[0-9;]*m", "", line).strip()
                  if not (line.startswith("e: ") or line.startswith("Execution failed for task ") or
                          line.startswith("> Could not ") or line.startswith("> A failure occurred ")):
                      continue
                  # Compiler messages only: never source snippets, stack traces or full paths.
                  line = re.sub(r"(?:file://)?/[^\s]*?/([^/\s]+\.kt)(?=[:(])", r"\1", line)
                  line = re.sub(r"https?://\S+", "<url>", line)
                  line = re.sub(r"(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)", "<redacted>", line)
                  line = line[:300]
                  if line not in messages:
                      messages.append(line)
                  if len(messages) == 6:
                      break
              diagnostics.extend({"stage": stage, "message": message} for message in messages)
              if not messages:
                  diagnostics.append({"stage": stage, "message": "Gradle exited unsuccessfully; see failed or missing tests in this summary"})
          native = Path(os.environ["RUNNER_TEMP"]) / "drivemate-native.log"
          if native.is_file():
              native_text = native.read_text(errors="replace")
              if "OutOfMemoryError" in native_text:
                  diagnostics.append({"stage": "screen", "message": "Android runtime reported OutOfMemoryError during emulator checks"})
              if "Fatal signal" in native_text:
                  diagnostics.append({"stage": "screen", "message": "Native renderer process terminated with a fatal signal during emulator checks"})
                  markers = [line.split("DM_CAT5_STAGE:", 1)[-1].strip() for line in native_text.splitlines() if "DM_CAT5_STAGE:" in line]
                  if markers:
                      diagnostics.append({"stage": "screen", "message": "Last native building stage: " + markers[-1][:100]})
                  frames = [line.strip() for line in native_text.splitlines() if re.search(r"#\d+ pc ", line)]
                  for frame in frames[:5]:
                      # Bounded symbols only: redact native addresses and directory paths.
                      frame = re.sub(r"(?:/[^ /]+)+/([^ /]+\.so)", r"\1", frame)
                      frame = re.sub(r"\b[0-9a-f]{8,}\b", "<address>", frame)
                      diagnostics.append({"stage": "screen", "message": frame[:300]})
          summary["diagnostics"] = diagnostics
          target.write_text(json.dumps(summary, indent=1) + "\n")
          PY_DIAGNOSTICS
          python3 ci/process_preflight.py --app-root app-src --summary results/summary.json
          python3 - <<'PY_CONNECTIONS'
          import json
          from pathlib import Path
          p=Path('results/summary.json')
          s=json.loads(p.read_text())
          report=json.loads(Path('results/category-connection-audit.json').read_text())
          apk=json.loads(Path('results/apk-connection-audit.json').read_text())
          s['category_connections']={
              'scope':report['scope'],
              'category_status':{k:v['status'] for k,v in report['categories'].items()},
              'blocked_categories':[int(k) for k,v in report['categories'].items()
                                    if v['status']=='blocked_needs_investigation'],
              'verified_live_downloads':0,
              'apk_binary_inspected': apk['dex_count'] > 0,
              'apk_status': apk['status'],
              'apk_blocked_categories': apk['blocked_categories'],
              'apk_sha256': apk['apk_sha256'],
          }
          p.write_text(json.dumps(s,indent=1)+'\n')
          PY_CONNECTIONS
          python3 ci/service_report.py \
            --summary results/summary.json --report results/service-probe.json \
            --batch "$DRIVEMATE_TEST_BATCH" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 ci/run_report.py results/full-app.json "$media" results/run-report.html || echo "picture page not built"
      - name: Publish the summary and picture page only
        # Only once the app was fetched, and never for a cancelled run.
        if: (success() || failure()) && steps.install.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # drivemate-app's APK build looks for this name: results for that exact app commit.
          name: ${{ (inputs.batch == '' || inputs.batch == 'all') && format('drivemate-tests-{0}', steps.install.outputs.app_sha) || format('drivemate-batch-{0}-{1}', inputs.batch, steps.install.outputs.app_sha) }}
          path: |
            results/full-app.json
            results/summary.json
            results/run-report.html
            results/process-summary.json
            results/suite-inventory.json
            results/test-dependencies.json
            results/frozen-source-provenance.json
            results/emulator-fixture-readback.json
            results/routing-release-alignment.json
            results/category-connection-audit.json
            results/apk-connection-audit.json
            results/service-probe.json
          if-no-files-found: error
          retention-days: 90
      - name: Every test passed
        # Only once the app was fetched, and never for a cancelled run.
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open("results/summary.json"))
          print(f"{s['passed']}/{s['total']} passed")
          sys.exit(0 if s["total"] and s["passed"] == s["total"] and not s.get("diagnostics") else 1)
          PY
