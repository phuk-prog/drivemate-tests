name: Test exact DriveMate app commit
on:
  push:
    branches: [main]
    paths: ['tests/**', '.github/workflows/test-app.yml']
  workflow_dispatch:
    inputs:
      app_sha:
        description: Full 40-character app commit SHA
        required: true
        default: '4d87cdceeae2a252472f7ccbd410d1f44dc053c6'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private-source read access
        env:
          TOKEN: ${{ secrets.DRIVEMATE_APP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set DRIVEMATE_APP_TOKEN to a read-only token restricted to phuk-prog/drivemate contents."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: harness
      - name: Validate app revision
        env:
          APP_SHA: ${{ inputs.app_sha || '4d87cdceeae2a252472f7ccbd410d1f44dc053c6' }}
        run: '[[ "$APP_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phuk-prog/drivemate
          ref: ${{ inputs.app_sha || '4d87cdceeae2a252472f7ccbd410d1f44dc053c6' }}
          token: ${{ secrets.DRIVEMATE_APP_TOKEN }}
          persist-credentials: false
          path: app-src
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install public suite in ephemeral app checkout
        run: |
          mkdir -p app-src/app/src/test/java/com/drivemate/app
          cp harness/tests/*.kt app-src/app/src/test/java/com/drivemate/app/
          printf '\ndependencies { testImplementation("junit:junit:4.13.2") }\n' >> app-src/app/build.gradle.kts
      - name: Run tests without publishing private compiler output
        working-directory: app-src
        run: |
          if ! ./gradlew :app:testDebugUnitTest --tests com.drivemate.app.NavigationSafetyTest --no-daemon --max-workers=4 > "$RUNNER_TEMP/private-test-build.log" 2>&1; then
            echo "::error::App compilation or navigation regression tests failed. Private build output is not published."
            exit 1
          fi
      - name: Publish counts and exact revisions
        env:
          APP_SHA: ${{ inputs.app_sha || '4d87cdceeae2a252472f7ccbd410d1f44dc053c6' }}
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          reports = glob.glob('app-src/app/build/test-results/testDebugUnitTest/TEST-*.xml')
          assert reports, 'No test results'
          totals = {k: 0 for k in ('tests', 'failures', 'errors', 'skipped')}
          for path in reports:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          assert totals['tests'] >= 9 and totals['failures'] == totals['errors'] == totals['skipped'] == 0, totals
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('App commit: ' + os.environ['APP_SHA'] + '\n\n')
              out.write('Harness commit: ' + os.environ['GITHUB_SHA'] + '\n\n')
              out.write(str(totals) + '\n')
          PY
      - name: Remove private checkout and build output
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/app-src"
          rm -f "$RUNNER_TEMP/private-test-build.log"
