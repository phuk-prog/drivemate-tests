name: Watch the app for new commits
# On the existing 30-minute cadence, dispatch only when the public suite has
# neither a verified success, a known failure (manual retry), nor active work.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: watch-app
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check watcher decision rules without Android
        run: python3 -m unittest ci.test_watch_app ci.test_workflow_scope
      - name: Find the current private app commit
        id: app
        env:
          TOKEN: ${{ secrets.DRIVEMATE_APP_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::Missing private app read-only token"; exit 1; }
          sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/phuk-prog/drivemate-app" refs/heads/main | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Cannot resolve app main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Reuse exact-source results or dispatch once
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SHA: ${{ steps.app.outputs.sha }}
        run: python3 ci/watch_app.py | tee -a "$GITHUB_STEP_SUMMARY"
