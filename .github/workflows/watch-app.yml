name: Watch the app for new commits
# Every 30 minutes: if drivemate-app's main has a commit no test run has covered yet, start
# "Test the app" for it. drivemate-app's APK build waits for that result.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: watch-app
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start a test run for an untested app commit
        env:
          TOKEN: ${{ secrets.DRIVEMATE_APP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret DRIVEMATE_APP_TOKEN is missing (see README)."; exit 1; fi
          sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/phuk-prog/drivemate-app" refs/heads/main | cut -f1)
          test -n "$sha"
          tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=drivemate-tests-$sha" --jq '.total_count')
          running=$(gh run list -R "$GITHUB_REPOSITORY" -w test-app.yml -e workflow_dispatch --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$tested" != "0" ]; then echo "App main $sha already tested."
          elif [ "$running" != "0" ]; then echo "A test run is already going."
          else
            gh workflow run test-app.yml -R "$GITHUB_REPOSITORY" --ref main -f app_ref="$sha"
            echo "Started a test run for app main $sha."
          fi
