        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DriveMate-settings-ui-result
          path: public-ui-results/settings-ui-result.json
          if-no-files-found: error
          retention-days: 30
