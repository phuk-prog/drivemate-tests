name: Category A emulator acceptance (disposable test APKs)
run-name: "Category A emulator acceptance: ${{ inputs.app_sha }}"
on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Exact private app SHA already passed by full public verification
        required: true
        default: '707499adfd40a97b3a6cc543f60b4d40af061251'
        type: string
      verification_run_id:
        description: Successful full public verification run for this exact app SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  position:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: apk-owner
    env:
      APP_SHA: ${{ inputs.app_sha }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
    steps:
      - name: Validate exact app revision and prerequisite full verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_VERIFY'
          import io, json, os, re, urllib.request, zipfile
          def verify():
              app_sha = os.environ['APP_SHA']
              run_id = os.environ['VERIFICATION_RUN_ID']
              assert re.fullmatch(r'[0-9a-f]{40}', app_sha), 'Invalid app SHA'
              assert re.fullmatch(r'[0-9]{1,15}', run_id), 'Invalid verification run ID'
              base = 'https://api.github.com/repos/phuk-prog/drivemate-tests'
              class SafeRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, request, fp, code, message, headers, newurl):
                      redirected = super().redirect_request(request, fp, code, message, headers, newurl)
                      if redirected is not None:
                          redirected.remove_header('Authorization')
                      return redirected
              opener = urllib.request.build_opener(SafeRedirect())
              def get(path, binary=False):
                  request = urllib.request.Request(base + path, headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                  with opener.open(request, timeout=45) as response:
                      data = response.read()
                  return data if binary else json.loads(data)
              run = get('/actions/runs/' + run_id)
              assert run['repository']['full_name'] == 'phuk-prog/drivemate-tests'
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              assert run['path'] == '.github/workflows/test-app.yml' and run['head_branch'] == 'main'
              assert run['event'] in ('push', 'workflow_dispatch')
              assert run['display_title'] == 'DriveMate verification: ' + app_sha
              jobs = []
              page = 1
              while True:
                  batch = get('/actions/runs/' + run_id + '/jobs?per_page=100&page=' + str(page))['jobs']
                  jobs.extend(batch)
                  if len(batch) < 100: break
                  page += 1
              assert jobs and all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in jobs)
              successful = {step['name'] for job in jobs for step in job.get('steps', []) if step['conclusion'] == 'success'}
              required = {'Run tests and lint without publishing private output', 'Check workflow contracts',
                          'Confirm no APK was created', 'Publish sanitized results', 'Upload sanitized results',
                          'Remove private checkout and compiler output'}
              assert required <= successful
              artifacts = get('/actions/runs/' + run_id + '/artifacts?per_page=100')['artifacts']
              matches = [a for a in artifacts if a['name'] == 'DriveMate-verification-results' and not a['expired']]
              assert len(matches) == 1
              archive = get('/actions/artifacts/' + str(matches[0]['id']) + '/zip', binary=True)
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  assert z.namelist() == ['verification-result.json']
                  proof = json.loads(z.read('verification-result.json'))
              assert proof['app_sha'] == app_sha and proof['harness_sha'] == run['head_sha']
              assert str(proof['run_id']) == run_id and int(proof['run_attempt']) == run['run_attempt']
              totals = proof['unit_tests']
              assert totals['tests'] >= 118 and all(totals[k] == 0 for k in ('failures', 'errors', 'skipped'))
              contracts = proof['workflow_contracts']
              assert contracts['tests'] >= 20 and contracts['failures'] == contracts['errors'] == 0
              assert proof['lint']['errors'] == 0 and proof['apk_created'] is False
              print(json.dumps({'app_sha': app_sha, 'verification_run_id': run_id,
                                'verification_attempt': run['run_attempt'], 'prerequisite_valid': True}, sort_keys=True))
          try:
              verify()
          except Exception as error:
              print('::error::Prerequisite verification failed: ' + type(error).__name__ + '; raw output withheld')
              raise SystemExit(1)
          PY_VERIFY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phuk-prog/drivemate
          ref: ${{ env.APP_SHA }}
          token: ${{ secrets.DRIVEMATE_APP_TOKEN }}
          persist-credentials: false
          path: app-src
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install emulator and build tooling
        run: |
          if ! sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-28;default;x86_64' > "$RUNNER_TEMP/position-sdk.log" 2>&1; then
            echo "::error::Emulator tooling installation failed; raw output withheld"
            exit 1
          fi
      - name: Install canonical emulator tests in ephemeral checkout
        run: |
          mkdir -p app-src/app/src/androidTest/java/com/drivemate/app
          cp harness/tests/emulator/CategoryAEmulatorTest.kt app-src/app/src/androidTest/java/com/drivemate/app/
          cat >> app-src/app/build.gradle.kts <<'GRADLE_TEST_ONLY'
          dependencies {
              androidTestImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test:runner:1.6.2")
              androidTestImplementation("androidx.test.uiautomator:uiautomator:2.3.0")
          }
          android { defaultConfig { testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner" } }
          GRADLE_TEST_ONLY
      - name: Validate sanitised diagnostic contract (known injected failure)
        run: python3 harness/tests/emulator/run_category_a.py --self-test
      - name: Build disposable app and instrumentation APKs
        working-directory: app-src
        env:
          DRIVEMATE_KEYSTORE_PATH: ''
          DRIVEMATE_KEYSTORE_PASSWORD: ''
          DRIVEMATE_KEY_ALIAS: ''
          DRIVEMATE_KEY_PASSWORD: ''
        run: |
          if ! ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=4 > "$RUNNER_TEMP/position-build.log" 2>&1; then
            python3 - <<'PY_BUILD_DIAGNOSTICS'
          import json, os, pathlib, re
          log = pathlib.Path(os.environ['RUNNER_TEMP'], 'position-build.log').read_text(errors='replace')
          print(json.dumps({'phase': 'apk-build', 'compiler_error_count': len(re.findall(r'(?m)^e: ', log)),
                            'failed_task_count': len(re.findall(r'(?m)^> Task .* FAILED$', log))}, sort_keys=True))
          PY_BUILD_DIAGNOSTICS
            echo "::error::Disposable test APK compilation failed; private output withheld"
            exit 1
          fi
          echo "APK=$GITHUB_WORKSPACE/app-src/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          echo "TEST_APK=$GITHUB_WORKSPACE/app-src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" >> "$GITHUB_ENV"
      - name: Boot isolated Android emulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$(id -u)" /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/position-home"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --force --name position-api28 --device pixel_2 --package 'system-images;android-28;default;x86_64' > "$RUNNER_TEMP/position-avd.log" 2>&1
          nohup "$ANDROID_HOME/emulator/emulator" -avd position-api28 -port 5554 -accel on -no-window -gpu guest -no-snapshot -no-audio -no-boot-anim -memory 1536 -cores 2 > "$RUNNER_TEMP/position-emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/position-emulator.pid"
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 240 "$adb" -s emulator-5554 wait-for-device
          deadline=$((SECONDS + 240))
          until [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            test "$SECONDS" -lt "$deadline"
            sleep 5
          done
          test "$("$adb" -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')" = 28
      - name: Run all Category A emulator acceptance checks
        id: category_a_acceptance
        timeout-minutes: 15
        run: python3 harness/tests/emulator/run_category_a.py
      - name: Upload sanitized Category A acceptance result (pass or fail)
        if: ${{ always() && steps.category_a_acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DriveMate-category-a-emulator-results
          path: public-results/category-a-emulator.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete disposable APKs and private runner output
        if: always()
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" -s emulator-5554 uninstall com.drivemate.app.test >/dev/null 2>&1 || true
          "$adb" -s emulator-5554 uninstall com.drivemate.app >/dev/null 2>&1 || true
          "$adb" -s emulator-5554 emu kill >/dev/null 2>&1 || true
          if [ -f "$RUNNER_TEMP/position-emulator.pid" ]; then
            emulator_pid="$(cat "$RUNNER_TEMP/position-emulator.pid")"
            kill "$emulator_pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              kill -0 "$emulator_pid" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$emulator_pid" 2>/dev/null || true
          fi
          # Remove private material independently of AVD shutdown/deletion races.
          rm -rf "$GITHUB_WORKSPACE/app-src" "$RUNNER_TEMP/position-"*.log
          for attempt in $(seq 1 5); do
            rm -rf "$RUNNER_TEMP/position-home" 2>/dev/null && break
            sleep 1
          done
          find "$RUNNER_TEMP" -name '*.apk' -delete 2>/dev/null || true
          test ! -e "$GITHUB_WORKSPACE/app-src"
          test -z "$(find "$GITHUB_WORKSPACE" -name '*.apk' -print -quit)"
          echo "Disposable APKs, private checkout and runner logs removed"
