name: Category A diagnostics contract self-test
on:
  push:
    branches:
      - diagnostics/category-a-exact-failures
    paths:
      - tests/emulator/run_category_a.py
      - tests/emulator/CategoryAEmulatorTest.kt
      - .github/workflows/diagnostics-self-test.yml
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -m py_compile tests/emulator/run_category_a.py
      - name: Inject known failure and verify sanitised diagnostics
        run: python3 tests/emulator/run_category_a.py --self-test
