name: Build signed APK
# For now (REGISTER.md): the signed release APK is built here, by hand, only after "Test the app"
# passed on the exact drivemate-app commit. The signing key is only in the "release" environment,
# which waits for the owner's approval and only serves main. The APK is saved only inside an
# AES-256 password-protected zip (password in the same environment). No debug APK is built.
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: drivemate-app branch, tag or commit to build
        required: false
        default: main
permissions:
  contents: read
  actions: write
concurrency:
  group: build-signed-apk
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  tested:
    name: 1. Every test passed on this exact app commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check the app token is set
        env:
          TOKEN: ${{ secrets.DRIVEMATE_APP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret DRIVEMATE_APP_TOKEN is missing (see README)."; exit 1; fi
      - name: Find the app commit and its test result
        id: check
        env:
          TOKEN: ${{ secrets.DRIVEMATE_APP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          APP_REF: ${{ inputs.app_ref }}
        run: |
          if [[ "$APP_REF" =~ ^[0-9a-f]{40}$ ]]; then sha="$APP_REF"
          else
            url="https://x-access-token:${TOKEN}@github.com/phuk-prog/drivemate-app"
            sha=$(git ls-remote "$url" "refs/heads/$APP_REF" | cut -f1)
            [ -n "$sha" ] || sha=$(git ls-remote "$url" "refs/tags/$APP_REF^{}" "refs/tags/$APP_REF" | head -1 | cut -f1)
          fi
          if [ -z "$sha" ]; then echo "::error::No drivemate-app commit for \"$APP_REF\"."; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # A finished test run for this commit, or start one and wait for it (up to 40 minutes).
          result() { gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=drivemate-tests-$sha" \
            --jq '[.artifacts[].workflow_run.id] | max // empty'; }
          running() { gh run list -R "$GITHUB_REPOSITORY" -w test-app.yml -e workflow_dispatch --json status \
            --jq '[.[] | select(.status != "completed")] | length'; }
          run=$(result)
          if [ -z "$run" ] && [ "$(running)" = 0 ]; then
            echo "No test run for ${sha:0:7} yet: starting one." | tee -a "$GITHUB_STEP_SUMMARY"
            gh workflow run test-app.yml -R "$GITHUB_REPOSITORY" --ref main -f app_ref="$sha"
          fi
          for i in $(seq 1 80); do
            run=$(result)
            if [ -n "$run" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)" = completed ]; then break; fi
            # No result and nothing running (e.g. the test run failed to start): stop.
            if [ -z "$run" ] && [ "$(running)" = 0 ] && [ "$i" -gt 2 ]; then
              echo "::error::The test run for ${sha:0:7} ended without results."; exit 1
            fi
            sleep 30
          done
          if [ -z "$run" ]; then echo "::error::No test result for ${sha:0:7} after 40 minutes."; exit 1; fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)
          echo "Test run for ${sha:0:7}: $conclusion ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$conclusion" != success ]; then echo "::error::Not every test passed on ${sha:0:7}: no APK."; exit 1; fi
  build:
    name: 2. Signed APK (waits for the owner's approval)
    needs: tested
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phuk-prog/drivemate-app
          ref: ${{ needs.tested.outputs.sha }}
          token: ${{ secrets.DRIVEMATE_APP_TOKEN }}
          path: app-src
          persist-credentials: false
      - name: Check the release secrets are set
        env:
          KEY_B64: ${{ secrets.DRIVEMATE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.DRIVEMATE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.DRIVEMATE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.DRIVEMATE_KEY_PASSWORD }}
          ZIP_PW: ${{ secrets.APK_ZIP_PASSWORD }}
        run: |
          missing=""
          for v in KEY_B64:DRIVEMATE_KEYSTORE_BASE64 STORE_PW:DRIVEMATE_KEYSTORE_PASSWORD ALIAS:DRIVEMATE_KEY_ALIAS \
                   KEY_PW:DRIVEMATE_KEY_PASSWORD ZIP_PW:APK_ZIP_PASSWORD; do
            name="${v%%:*}"
            [ -n "${!name}" ] || missing="$missing ${v#*:}"
          done
          if [ -n "$missing" ]; then echo "::error::Missing in the release environment:$missing"; exit 1; fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build the What's new page
        working-directory: app-src
        run: |
          mkdir -p run-evidence
          echo '{"checklist": {}}' > run-evidence/full-app.json
          echo '{"suites": []}' > run-evidence/public-suites.json
          python3 scripts/build_whats_new.py whats-new/entries.json run-evidence/full-app.json run-evidence \
            run-evidence/public-suites.json app/src/main/assets/whats-new | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore the signing key (temporary file, removed at the end)
        env:
          KEY_B64: ${{ secrets.DRIVEMATE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/drivemate-release.jks"
          chmod 600 "$RUNNER_TEMP/drivemate-release.jks"
      - name: Build the signed release APK
        working-directory: app-src
        env:
          DRIVEMATE_KEYSTORE_PATH: ${{ runner.temp }}/drivemate-release.jks
          DRIVEMATE_KEYSTORE_PASSWORD: ${{ secrets.DRIVEMATE_KEYSTORE_PASSWORD }}
          DRIVEMATE_KEY_ALIAS: ${{ secrets.DRIVEMATE_KEY_ALIAS }}
          DRIVEMATE_KEY_PASSWORD: ${{ secrets.DRIVEMATE_KEY_PASSWORD }}
          # Public OAuth client ID (not a secret); empty keeps OpenStreetMap note sign-in off.
          OSM_OAUTH_CLIENT_ID: ${{ vars.OSM_OAUTH_CLIENT_ID }}
        run: |
          # Above the numbers drivemate-app's own builds used (100,000 + its run number), so it
          # updates the installed app.
          export DRIVEMATE_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          echo "Version code $DRIVEMATE_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew assembleRelease --no-daemon --max-workers=4
      - name: Check the signature and lock the APK in a password-protected zip
        working-directory: app-src
        env:
          ZIP_PW: ${{ secrets.APK_ZIP_PASSWORD }}
          SHA: ${{ needs.tested.outputs.sha }}
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -i "certificate SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
          command -v 7z >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q p7zip-full; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/DriveMate-${SHA:0:7}.apk"
          (cd "$RUNNER_TEMP/out" && 7z a -tzip -mem=AES256 -p"$ZIP_PW" "DriveMate-${SHA:0:7}.zip" "DriveMate-${SHA:0:7}.apk" >/dev/null)
          rm -f "$RUNNER_TEMP/out/DriveMate-${SHA:0:7}.apk" "$apk"
          ls -l "$RUNNER_TEMP/out"
      - name: Upload the locked zip only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DriveMate-signed-${{ needs.tested.outputs.sha }}
          path: ${{ runner.temp }}/out/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/drivemate-release.jks"
