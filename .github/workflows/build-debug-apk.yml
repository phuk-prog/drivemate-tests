name: Build debug APK
# For now (REGISTER.md): the debug APK is built here, by hand, only after "Test the app" passed on
# the exact drivemate-app commit. No signing keys are kept here: it is signed with a throwaway debug
# key, so it can't update an APK signed with the release key. Anyone with a GitHub account can
# download it. No tests run in this build.
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: drivemate-app branch, tag or commit to build
        required: false
        default: main
permissions:
  contents: read
  actions: read
concurrency:
  group: build-debug-apk
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the app token is set
        env:
          TOKEN: ${{ secrets.DRIVEMATE_APP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret DRIVEMATE_APP_TOKEN is missing (see README)."; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phuk-prog/drivemate-app
          ref: ${{ inputs.app_ref }}
          token: ${{ secrets.DRIVEMATE_APP_TOKEN }}
          path: app-src
          persist-credentials: false
      - name: Every test passed on this exact app commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git -C app-src rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=drivemate-tests-$sha" \
            --jq '[.artifacts[].workflow_run.id] | max // empty')
          if [ -z "$run" ]; then
            echo "::error::No test run for app commit $sha. Run \"Test the app\" for it first."; exit 1
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)
          echo "Newest test run for ${sha:0:7}: $conclusion ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$conclusion" = success
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build the What's new page
        working-directory: app-src
        run: |
          mkdir -p run-evidence
          echo '{"checklist": {}}' > run-evidence/full-app.json
          echo '{"suites": []}' > run-evidence/public-suites.json
          python3 scripts/build_whats_new.py whats-new/entries.json run-evidence/full-app.json run-evidence \
            run-evidence/public-suites.json app/src/main/assets/whats-new | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build debug APK
        working-directory: app-src
        env:
          # Public OAuth client ID (not a secret); empty keeps OpenStreetMap note sign-in off.
          OSM_OAUTH_CLIENT_ID: ${{ vars.OSM_OAUTH_CLIENT_ID }}
        run: |
          # Above the numbers drivemate-app's own builds used (100,000 + its run number).
          export DRIVEMATE_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          echo "Version code $DRIVEMATE_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew assembleDebug --no-daemon --max-workers=4
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DriveMate-debug-${{ steps.tested.outputs.sha }}
          path: app-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
